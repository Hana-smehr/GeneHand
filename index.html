<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <title>GeneHand</title>
  <script src='https://3Dmol.org/build/3Dmol-min.js'></script>
  <style>
    body { margin:0; background:#111; }
    #viewer { width:100vw; height:100vh; position:relative; }
    #cam { position:fixed; bottom:10px; left:10px; width:240px;
           transform:scaleX(-1); border-radius:8px; }
  </style>
</head>
<body>
  <div id='panel' style='position:fixed; top:10px; left:10px; z-index:10; width:300px; font:14px system-ui; color:#fff'>
  <input id='q' placeholder='Search PDB (e.g. hemoglobin)' style='width:100%; padding:8px; box-sizing:border-box'>
  <div id='results' style='max-height:60vh; overflow-y:auto; background:rgba(0,0,0,.75)'></div>
  </div>
  <div id='viewer'></div>
  <video id='cam' autoplay playsinline muted></video>
  <script type='module' src='app.js'></script>
  <div id='dbg' style='position:fixed; top:10px; right:10px; color:#0f0; font:14px monospace'></div>
</body>
</html>
